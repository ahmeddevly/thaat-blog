lash.com/photo-1622253692010-333f2da6031d?auto=format&fit=crop&w=400&q=80",bio:"طبيب استشاري بخبرة تتجاوز 15 عاماً في المستشفيات السعودية وتطوير خدمات الرعاية الطبية المنزلية المعتمدة."},publishedAt:"15 مايو 2026",readTime:"6 دقائق قراءة",views:3420,likes:184,image:"https://images.unsplash.com/photo-1576091160550-2173dba999ef?auto=format&fit=crop&w=1200&q=80",tags:["طبيب منزلي","الرياض","جدة","كبار السن","رعاية عاجلة"],featured:!0,saudiFocus:"متوافق مع معايير وزارة الصحة السعودية (MOH) ومتاح للتغطية الفورية في الرياض، جدة، والدمام.",tableOfContents:[{id:"intro",label:"مقدمة عن الحاجة للطبيب المنزلي"},{id:"benefits",label:"أبرز 5 فوائد لزيارة الطبيب في المنزل"},{id:"when-to-call",label:"الحالات الطبية التي يغطيها الطبيب المنزلي"},{id:"elderly-care",label:"أهمية الرعاية المنزلية لكبار السن في المملكة"},{id:"how-to-book",label:"كيف تحجز زيارة طبيب منزلي موثوقة عبر ذات (thaat.co)"}],content:`
      <div id="intro" class="mb-8">
        <p class="text-lg leading-relaxed text-slate-700 mb-4">
          في ظل تسارع نمط الحياة في المدن السعودية الكبرى مثل الرياض وجدة والدمام، أصبح التوجه نحو الرعاية الصحية المنزلية خياراً استراتيجياً لا غنى عنه للأسر التي تبحث عن الراحة، والأمان، والجودة الطبية العالية دون تكبد عناء الانتظار في طوارئ المستشفيات أو التعرض لمخاطر العدوى.
        </p>
        <p class="text-lg leading-relaxed text-slate-700">
          خدمة الطبيب المنزلي لم تعد تقتصر على الحالات البسيطة، بل تطورت لتشمل فحص وتقييم شامل، وضع خطط علاجية لكبار السن، ومتابعة الأمراض المزمنة بدقة متناهية تحت إشراف أطباء مرخصين ومعتمدين من الهيئة السعودية للتخصصات الصحية.
        </p>
      </div>

      <div id="benefits" class="mb-8">
        <h3 class="text-2xl font-bold text-[#283373] mb-4 border-r-4 border-[#283373] pr-3">أبرز 5 فوائد لزيارة الطبيب في المنزل</h3>
        <ul class="space-y-4 text-slate-700">
          <li class="flex items-start gap-3">
            <span class="w-6 h-6 rounded-full bg-blue-100 text-[#283373] flex items-center justify-center flex-shrink-0 font-bold mt-1">1</span>
            <div><strong>توفير الوقت والجهد:</strong> تجنب زحام الطرق وغرف الانتظار المكتظة، خاصة للمرضى الذين يعانون من صعوبات في الحركة.</div>
          </li>
          <li class="flex items-start gap-3">
            <span class="w-6 h-6 rounded-full bg-blue-100 text-[#283373] flex items-center justify-center flex-shrink-0 font-bold mt-1">2</span>
            <div><strong>تقليل مخاطر العدوى:</strong> حماية كبار السن وأصحاب المناعة الضعيفة من الفيروسات والبكتيريا المنتشرة في المرافق الصحية.</div>
          </li>
          <li class="flex items-start gap-3">
            <span class="w-6 h-6 rounded-full bg-blue-100 text-[#283373] flex items-center justify-center flex-shrink-0 font-bold mt-1">3</span>
            <div><strong>رعاية مخصصة وشخصية:</strong> يحصل المريض على وقت كافٍ من الطبيب لفحص حالته ومناقشة تفاصيل نمط حياته داخل بيئته الطبيعية.</div>
          </li>
          <li class="flex items-start gap-3">
            <span class="w-6 h-6 rounded-full bg-blue-100 text-[#283373] flex items-center justify-center flex-shrink-0 font-bold mt-1">4</span>
            <div><strong>الخصوصية التامة:</strong> الحفاظ على سرية وخصوصية المريض وعائلته أثناء إجراء الفحوصات وتلقي العلاج.</div>
          </li>
          <li class="flex items-start gap-3">
            <span class="w-6 h-6 rounded-full bg-blue-100 text-[#283373] flex items-center justify-center flex-shrink-0 font-bold mt-1">5</span>
            <div><strong>دعم العائلة وتوجيهها:</strong> إمكانية جلوس الطبيب مع أفراد الأسرة وتوجيههم حول كيفية التعامل مع المريض وتغذيته ومواعيد أدويته.</div>
          </li>
        </ul>
      </div>

      <div class="my-8 p-6 bg-blue-50/80 rounded-2xl border border-blue-100 text-center">
        <h4 class="text-xl font-bold text-[#283373] mb-2">هل تحتاج إلى طبيب منزلي الآن في الرياض أو جدة أو الشرقية؟</h4>
        <p class="text-slate-600 mb-6">أطباؤنا متاحون على مدار الساعة للوصول إلى منزلك وتقديم الرعاية الفورية. تواصل معنا عبر الواتساب أو الاتصال المباشر.</p>
        <div class="flex flex-wrap justify-center gap-4">
          <a href="https://wa.me/966920033184?text=مرحباً، أريد طلب خدمة طبيب منزلي من خلال مدونة الرعاية المنزلية" target="_blank" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg transition-all flex items-center gap-2">
            تواصل عبر واتساب
          </a>
